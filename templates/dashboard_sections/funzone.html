<link rel="stylesheet" href="{{ url_for('static', filename='css/funzone.css') }}">

<div class="funzone-container">

<h2 class="funzone-title">
<i class="fa-solid fa-gamepad"></i>
Fun Zone Arcade
</h2>

<div class="games-grid">

<div class="game-card" onclick="startGame('rapid')">
<i class="fa-solid fa-bolt"></i>
<span>Rapid Fire</span>
</div>

<div class="game-card" onclick="startGame('math')">
<i class="fa-solid fa-calculator"></i>
<span>Lightning Math</span>
</div>

<div class="game-card" onclick="startGame('memory')">
<i class="fa-solid fa-brain"></i>
<span>Memory Match</span>
</div>

<div class="game-card" onclick="startGame('pattern')">
<i class="fa-solid fa-puzzle-piece"></i>
<span>Pattern Master</span>
</div>

<div class="game-card" onclick="startGame('word')">
<i class="fa-solid fa-font"></i>
<span>Word Builder</span>
</div>

<div class="game-card" onclick="startGame('sentence')">
<i class="fa-solid fa-pen"></i>
<span>Sentence Builder</span>
</div>

<div class="game-card" onclick="startGame('target')">
<i class="fa-solid fa-bullseye"></i>
<span>Target Math</span>
</div>

<div class="game-card" onclick="startGame('truefalse')">
<i class="fa-solid fa-circle-question"></i>
<span>True or False</span>
</div>

<div class="game-card" onclick="startGame('picture')">
<i class="fa-solid fa-image"></i>
<span>Picture Quiz</span>
</div>

<div class="game-card" onclick="startGame('geo')">
<i class="fa-solid fa-globe"></i>
<span>World Explorer</span>
</div>

<div class="game-card" onclick="startGame('ladder')">
<i class="fa-solid fa-stairs"></i>
<span>Number Ladder</span>
</div>

<div class="game-card" onclick="startGame('treasure')">
<i class="fa-solid fa-gem"></i>
<span>Treasure Hunt</span>
</div>

</div>

</div>


<!-- GAME POPUP MODAL -->

<div id="gameModal" class="game-modal">

<div class="game-window">

<div class="game-header">

<h3 id="gameTitle">Game</h3>

<!-- Font Awesome Close Icon -->
<i class="fa-solid fa-xmark" onclick="closeGame()" style="cursor:pointer;font-size:22px;"></i>

</div>

<div id="gameArea">

<!-- Game content will load here -->

</div>

</div>

</div>


<script>

function startGame(game){

document.getElementById("gameModal").style.display="flex"

let scriptPath = ""
let title = ""

if(game=="rapid"){
title="Rapid Fire Quiz"
scriptPath="/static/games/rapid_fire.js"
}

else if(game=="math"){
title="Lightning Math"
}

else if(game=="memory"){
title="Memory Match"
}

else if(game=="pattern"){
title="Pattern Master"
}

else if(game=="word"){
title="Word Builder"
}

else if(game=="sentence"){
title="Sentence Builder"
}

else if(game=="target"){
title="Target Math"
}

else if(game=="truefalse"){
title="True or False"
}

else if(game=="picture"){
title="Picture Quiz"
}

else if(game=="geo"){
title="World Explorer"
}

else if(game=="ladder"){
title="Number Ladder"
}

else if(game=="treasure"){
title="Treasure Hunt"
}

document.getElementById("gameTitle").innerText = title
document.getElementById("gameArea").innerHTML = ""

if(scriptPath!=""){
loadGame(scriptPath)
}else{
document.getElementById("gameArea").innerHTML="<p>Game coming soon...</p>"
}

}


function loadGame(path){

// if the script already exists, just start the game
if(document.querySelector('script[data-game="rapid"]')){
    if(typeof startRapidFire === "function"){
        startRapidFire()
    }
    return
}

let script = document.createElement("script")

script.src = path
script.dataset.game = "rapid"

script.onload = function(){

if(window.RapidFireGame){
RapidFireGame.start()
}

}


document.body.appendChild(script)

}

function closeGame(){

document.getElementById("gameModal").style.display="none"
document.getElementById("gameArea").innerHTML=""

if(typeof timerInterval !== "undefined"){
clearInterval(timerInterval)
}

}

</script>
