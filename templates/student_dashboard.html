<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>LearniX Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- TOP NAVBAR -->

<div class="navbar">

<!-- LEFT SIDE -->

<div class="nav-left">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>
<span>LearniX</span>

</div>

<div class="welcome">

<p class="welcome-text">Welcome, <b>{{ username }}</b></p>

<div class="user-stats">

<span class="streak">
<i class="fa-solid fa-fire"></i>
{{ streak }} Day Streak
</span>

<span class="level">
<i class="fa-solid fa-star"></i>
Level {{ level }}
</span>

</div>

</div>

</div>


<!-- RIGHT SIDE -->

<div class="nav-right">

<button class="points-btn">

<i class="fa-solid fa-trophy"></i>
{{ xp }} Points

</button>

<button class="challenge-btn">

<i class="fa-solid fa-bolt"></i>
Challenges

</button>

<a href="/logout" class="logout-btn">

<i class="fa-solid fa-right-from-bracket"></i>

</a>

</div>

</div>

<div class="dashboard-menu">

<a href="/progress" class="menu-btn progress">
<i class="fa-solid fa-chart-line"></i>
<span>My Progress</span>
</a>

<a href="/courses" class="menu-btn courses">
<i class="fa-solid fa-book-open"></i>
<span>Courses</span>
</a>

<a href="/funzone" class="menu-btn funzone">
<i class="fa-solid fa-gamepad"></i>
<span>Fun Zone</span>
</a>

<a href="/quizzes" class="menu-btn quizzes">
<i class="fa-solid fa-bolt"></i>
<span>Live Quizzes</span>
</a>

<a href="/settings" class="menu-btn settings">
<i class="fa-solid fa-gear"></i>
<span>Settings</span>
</a>

</div>

</body>
</html>
